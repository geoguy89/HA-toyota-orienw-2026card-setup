        confirmation:
          text: Record an oil change at today's odometer?
    - entity: input_number.toyota_last_oil_change_odometer
      name: Last oil change odometer
    - entity: input_datetime.toyota_last_oil_change_date
      name: Last oil change date
    - entity: input_number.toyota_oil_change_interval
      name: Interval (miles)
    - entity: input_number.toyota_oil_change_months
      name: Interval (months)
    - type: section
      label: Schedule weather gate
    - entity: input_number.toyota_cold_below
      name: Start if colder than
    - entity: input_number.toyota_hot_above
      name: Start if hotter than
    - type: section
      label: Lease tracker (leave start odometer at 0 to hide)
    - entity: input_number.toyota_lease_start_odometer
      name: Lease start odometer
    - entity: input_datetime.toyota_lease_start_date
      name: Lease start date
