- type: custom:button-card
  name: REMOTE START SCHEDULE
  show_icon: false
  tap_action:
    action: none
  styles:
    card:
    - background: transparent
    - box-shadow: none
    - padding: 10px 0 2px
    - margin: '0'
    name:
    - color: rgba(255,255,255,0.35)
    - font-size: 10px
    - font-weight: '700'
    - letter-spacing: 3px
    - text-align: left
    - justify-self: start
- type: custom:button-card
  show_icon: false
  show_name: false
  show_state: false
  show_label: true
  tap_action:
    action: none
  label: '[[[ const on=states[''input_boolean.toyota_schedule_enabled'']?.state===''on'';

    const one=states[''input_boolean.toyota_one_time_enabled'']?.state===''on'';

    const gate=states[''input_boolean.toyota_weather_gate'']?.state===''on'';

    const tm=states[''input_datetime.toyota_schedule_time'']?.state, days=(states[''input_text.toyota_schedule_days'']?.state||'''').split('','').filter(Boolean);

    const order=[''sun'',''mon'',''tue'',''wed'',''thu'',''fri'',''sat''];

    const fmtT=s=>{if(!s||s===''unknown'')return ''—'';const [h,m]=s.split('':'');const d=new Date();d.setHours(+h,+m,0,0);return d.toLocaleTimeString([], {hour:''numeric'',minute:''2-digit''});};

    let next=null;

    if(on&&tm&&days.length){const [h,m]=tm.split('':'');for(let i=0;i<8;i++){const d=new Date();d.setDate(d.getDate()+i);d.setHours(+h,+m,0,0);if(d>new Date()&&days.includes(order[d.getDay()])){next=d;break;}}}

    const ot=states[''input_datetime.toyota_one_time_start'']?.state; let oneD=null;

    if(one&&ot&&ot!==''unknown''){const d=new Date(ot.replace('' '',''T''));if(d>new Date()) oneD=d;}

    const cand=[next,oneD].filter(Boolean).sort((a,b)=>a-b)[0];

    const nextTxt=cand?cand.toLocaleString([], {weekday:''short'',month:''short'',day:''numeric'',hour:''numeric'',minute:''2-digit''}):''No start scheduled'';

    const lo=parseFloat(states[''input_number.toyota_cold_below'']?.state), hi=parseFloat(states[''input_number.toyota_hot_above'']?.state);

    return `<div style="padding:12px 16px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:10px;font-weight:700;letter-spacing:1px;color:rgba(255,255,255,0.4)">NEXT AUTO-START</span><span style="font-size:13px;font-weight:600;color:${cand?''#00e5ff'':''rgba(255,255,255,0.4)''}">${nextTxt}</span></div>

    <div style="font-size:10px;color:rgba(255,255,255,0.35);margin-top:6px">${on?''Repeats ''+(days.length?days.join('' · ''):''(pick days)'')+'' at ''+fmtT(tm):''Recurring off''}${gate?` · only below ${isNaN(lo)?''?'':lo}° or above ${isNaN(hi)?''?'':hi}°`:''''}</div></div>`; ]]]'
  styles:
    card:
    - background: rgba(255,255,255,0.04)
    - border-radius: 16px
    - padding: '0'
    - margin: 2px 0
    - box-shadow: none
    label:
    - width: 100%
    - margin: '0'
    - padding: '0'
    - white-space: normal
